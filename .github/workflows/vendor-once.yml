name: 一次性依赖内置（vendor）

# 临时工作流（用户要求）：下载全部依赖源码入仓（cargo vendor），
# 提交 vendor/ 目录与 .cargo/config.toml（离线源替换）后自动删除本文件。
# 目的：防上游投毒（cargo 按 Cargo.lock 校验 vendor 内 .crate checksum）、
# 大陆机器离线编译、后续可自主审计/优化依赖源码。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo vendor 并生成离线源配置
        run: |
          cargo vendor vendor > /tmp/vendor-config.txt
          mkdir -p .cargo
          {
            cat /tmp/vendor-config.txt
            # aarch64-musl 交叉链接器（release 工作流追加段，避免覆盖丢失）
            printf '\n[target.aarch64-unknown-linux-musl]\nlinker = "aarch64-linux-gnu-gcc"\n'
          } > .cargo/config.toml
          cat .cargo/config.toml
          du -sh vendor
      - name: 离线编译验证
        run: cargo build --release --offline 2>&1 | tail -3
      - name: 离线测试验证
        run: cargo test --offline 2>&1 | grep -E "test result" | head -4
      - name: 提交 vendor 与配置
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor .cargo/config.toml Cargo.lock
          git commit -m "chore: 内置全部依赖源码（cargo vendor）

- vendor/ 含完整依赖树源码，.crate checksum 与 Cargo.lock 锚定
- .cargo/config.toml 将 crates-io 替换为 vendored-sources（离线编译）
- 已验证：cargo build/test --offline 全绿"
          git push
      - name: 删除本临时工作流
        run: |
          git rm .github/workflows/vendor-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 移除一次性 vendor 工作流（任务已完成）"
          git push
