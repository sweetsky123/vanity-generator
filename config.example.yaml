# ===== config.yaml 示例（复制到可执行文件同目录使用）=====

# 助记词长度（词数），只允许 12 / 18 / 24，其他值会报错
word_count: 24

# 靓号规则：front / middle / back 至少定义一个，否则启动时报错
# front: 去掉 0x 后必须以该前缀开头（带 0x 也可写作 "0x8888"，解析时归一化）
# middle: 去掉 0x 后地址中任意位置包含该子串
# back: 去掉 0x 后必须以该后缀结尾
# 多字段同时定义时必须同时满足；取值只能包含 [0-9a-fA-F]
front: "8888"
# middle: "8888"
back: "8888"

# BIP32 派生路径，不填默认 m/44'/60'/0'/0/0
# 允许任意合法路径，如 m/44'/60'/0'/0/217
path: "m/44'/60'/0'/0/0"

# 需要找到多少个符合条件的地址（1..=1000）
# 每找到一个立即 GPG 加密落盘，然后继续找下一个
count: 5

# GPG 公钥文件名（相对可执行文件所在目录；后缀名不限，
# 只要能用纯文本打开且首行是 -----BEGIN PGP PUBLIC KEY BLOCK-----）
gpg_key_file: "fx1024.asc"
